# hyprlock — Ayu Dark themed lock screen

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    color = rgba(0b0e14ff)
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(e6b450ff)
    inner_color = rgba(131721ff)
    font_color  = rgba(bfbdb6ff)
    fade_on_empty = true
    placeholder_text = <span foreground="##bfbdb6">Password…</span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(e6b450ff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(bfbdb6ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
