# Hyprland config — Ayu Dark theme, i3-style keybinds
# https://wiki.hypr.land/Configuring/

################
### MONITORS ###
################
monitor = , preferred, auto, 1


###################
### MY PROGRAMS ###
###################
$terminal = kitty
$menu = rofi -show drun
$fileManager = nautilus


#################
### AUTOSTART ###
#################
exec-once = waybar
exec-once = hyprpaper
exec-once = mako
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dex --autostart --environment hyprland
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct


#####################
### LOOK AND FEEL ###
#####################

# Ayu Dark palette
$bg        = rgb(0b0e14)
$bg_alt    = rgb(131721)
$fg        = rgb(bfbdb6)
$ui        = rgb(565b66)
$accent    = rgb(e6b450)
$blue      = rgb(59c2ff)
$orange    = rgb(ff8f40)
$red       = rgb(f07178)

general {
    gaps_in = 9
    gaps_out = 18
    border_size = 2
    col.active_border = $accent
    col.inactive_border = $ui
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 4
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(0b0e14ee)
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.15
    }
}

animations {
    enabled = true
    bezier = ease, 0.4, 0, 0.2, 1
    animation = windows,     1, 4, ease
    animation = windowsOut,  1, 4, ease, popin 80%
    animation = border,      1, 8, default
    animation = fade,        1, 4, default
    animation = workspaces,  1, 4, ease
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############
input {
    kb_layout = us,ru
    kb_options = grp:caps_toggle
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

###################
### KEYBINDINGS ###
###################
$mod = SUPER

# Apps & shell
bind = $mod,       Return, exec, $terminal
bind = $mod,       q,      killactive,
bind = $mod,       space,  exec, $menu
bind = $mod SHIFT, p,      exec, hyprpicker -a

# Layout / window state (i3-style)
bind = $mod,       f,      fullscreen, 0
bind = $mod SHIFT, space,  togglefloating,
bind = $mod,       t,      pin,           # closest analog to i3 mode_toggle
bind = $mod,       v,      togglesplit,   # dwindle: flips next split direction
bind = $mod,       g,      togglesplit,
bind = $mod,       e,      togglesplit,
bind = $mod,       s,      togglegroup,   # i3 stacking analog (window groups)
bind = $mod,       w,      changegroupactive, f
bind = $mod,       a,      movefocus, u   # focus parent (best effort in dwindle)
bind = $mod,       d,      movefocus, d   # focus child (best effort in dwindle)

# Focus (vim direction keys, like i3)
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

# Move window (Shift + vim direction keys)
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Session
bind = $mod SHIFT, c, exec, hyprctl reload      # i3 reload
bind = $mod SHIFT, r, exec, hyprctl reload      # i3 restart (no live restart in Hyprland)
bind = $mod SHIFT, e, exec, hyprctl dispatch exit

# Screenshot — region to clipboard (replaces maim | xclip)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Floating window drag/resize with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Audio (locked + repeat-on-hold)
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl  = , XF86AudioMute,        exec, pactl set-sink-mute   @DEFAULT_SINK@   toggle
bindl  = , XF86AudioMicMute,     exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media keys
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous

# Resize mode (i3-style submap)
bind = $mod, r, submap, resize
submap = resize
binde = , h, resizeactive, -20 0
binde = , j, resizeactive, 0 20
binde = , k, resizeactive, 0 -20
binde = , l, resizeactive, 20 0
bind  = , Return, submap, reset
bind  = , Escape, submap, reset
bind  = $mod, r, submap, reset
submap = reset


##############################
### WINDOW RULES & LAYOUTS ###
##############################
windowrule {
    name = suppress-maximize
    suppress_event = maximize
    match:class = .*
}

windowrule {
    name = no-focus-empty
    no_focus = true
    match:class = ^$
    match:title = ^$
    match:xwayland = 1
    match:float = 1
    match:fullscreen = 0
    match:pin = 0
}

# Picture-in-picture floats
windowrule {
    name = pip-float
    float = true
    match:title = ^(Picture-in-Picture)$
}

windowrule {
    name = pip-pin
    pin = true
    match:title = ^(Picture-in-Picture)$
}
